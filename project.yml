# XcodeGen の spec（https://github.com/yonaskolb/XcodeGen）。.xcodeproj はコミットせず、CI と手元で生成する。
# 名前と Bundle ID は scripts/new-app.sh が書き換える（テンプレートの名前・Bundle ID の文字列を全部置き換える）。
name: DawnSky
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  DawnSky:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "あさやけ図鑑"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 標準の HTTPS 以外の暗号を使わない前提。使うなら本人に戻す（輸出規制の申告が変わる）
        ITSAppUsesNonExemptEncryption: false
        # 空を撮るためのカメラ（写真は色を読むためだけに使い、端末の外に送らない）。文言は InfoPlist.xcstrings で日本語・英語
        NSCameraUsageDescription: "その朝の空の色を読んで、図鑑とパレットに入れるために使います。写真はこの iPhone の外に送りません。"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.008
        PRODUCT_NAME: DawnSky
        # iPhone だけ（iPad 対応にすると iPad のスクリーンショットも提出に要る）
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  DawnSkyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DawnSky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.008.tests
        GENERATE_INFOPLIST_FILE: YES
  # 主な流れのタップと撮影・主なボタンが画面の中にあるかの検査（UITests/MainFlowUITests.swift）
  DawnSkyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: DawnSky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.008.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DawnSky
schemes:
  DawnSky:
    build:
      targets:
        DawnSky: all
        DawnSkyTests: [test]
        DawnSkyUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - DawnSkyTests
        - DawnSkyUITests
